<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistemas Dakota · Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root { --bg:#0a0a0d; --s1:#121218; --s2:#181820; --line:#24242e; --txt:#ececf0; --mut:#8c8c98;
          --coral:#ff6b5b; --coral2:#ff9a8d; --ok:#3ecf8e; --warn:#f5b041; --err:#ff4d4f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:Inter,Segoe UI,sans-serif; }
  .wrap { max-width:1280px; margin:0 auto; padding:28px 20px 60px; }
  header { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
           border-top:6px solid var(--coral); padding-top:22px; }
  h1 { font-family:Anton,sans-serif; font-weight:400; font-size:44px; letter-spacing:.02em; margin:0; line-height:1; }
  h1 span { color:var(--coral); }
  .sub { color:var(--mut); font-size:14px; margin-top:6px; }
  .tabs { display:flex; gap:6px; background:var(--s1); padding:4px; border-radius:10px; border:1px solid var(--line); }
  .tabs button { background:none; border:0; color:var(--mut); font:600 13px Inter,sans-serif; padding:8px 14px;
                 border-radius:7px; cursor:pointer; }
  .tabs button.on { background:var(--coral); color:#fff; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin:26px 0; }
  .kpi { background:var(--s1); border:1px solid var(--line); border-radius:14px; padding:18px 18px 16px; }
  .kpi .lab { color:var(--mut); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; }
  .kpi .val { font-family:Anton,sans-serif; font-size:42px; line-height:1.1; margin-top:8px; }
  .kpi .del { font-size:13px; font-weight:600; margin-top:4px; }
  .sub-kpi { color:var(--mut); font-size:14px; font-weight:600; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }
  .sub-kpi b { color:var(--txt); font-family:Anton,sans-serif; font-weight:400; font-size:24px; margin-left:6px; }
  .seccion { margin:26px 0 8px; }
  .seccion h2 { font-family:Anton,sans-serif; font-weight:400; font-size:24px; letter-spacing:.04em; margin:0 0 10px; }
  .seccion h2 em { font-style:normal; color:var(--coral); }
  .seccion h2 span { color:var(--mut); font-family:Inter,sans-serif; font-size:13px; font-weight:500; letter-spacing:0; margin-left:8px; }
  .seccion .kpis { margin:0; }
  .seccion.total .kpi { border-color:var(--coral); }
  .kpi .nota { color:var(--mut); font-size:12px; margin-top:6px; }
  #equipos { margin-top:26px; }
  .periodos { display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .mas { display:flex; flex-wrap:wrap; gap:6px; align-items:center; justify-content:flex-end; }
  .mas select, .mas input { background:var(--s1); color:var(--txt); border:1px solid var(--line); border-radius:8px;
    font:500 13px Inter,sans-serif; padding:7px 10px; color-scheme:dark; }
  .mas .a { color:var(--mut); font-size:13px; }
  .boton { background:var(--s2); color:var(--txt); border:1px solid var(--line); border-radius:8px; cursor:pointer;
    font:600 13px Inter,sans-serif; padding:7px 12px; }
  .boton.excel { border-color:var(--ok); color:var(--ok); }
  .boton:hover { border-color:var(--coral); }
  @media (max-width:600px) { .periodos { align-items:stretch; width:100%; } .mas { justify-content:flex-start; } }
  #equipos h3 { font-size:14px; letter-spacing:.06em; margin:0 0 10px; }
  .bloque { margin-bottom:18px; }
  .up { color:var(--ok); } .down { color:var(--err); } .flat { color:var(--mut); }
  .grid { display:grid; grid-template-columns:repeat(12,1fr); gap:12px; }
  .card { background:var(--s1); border:1px solid var(--line); border-radius:14px; padding:18px; min-width:0; }
  .card h3 { margin:0 0 14px; font-size:14px; font-weight:700; letter-spacing:.02em; }
  .card h3 small { color:var(--mut); font-weight:500; margin-left:6px; }
  .c8 { grid-column:span 8; } .c4 { grid-column:span 4; } .c6 { grid-column:span 6; } .c12 { grid-column:span 12; }
  @media (max-width:900px) { .c8,.c4,.c6 { grid-column:span 12; } h1 { font-size:34px; } }
  .alto { height:280px; position:relative; } .medio { height:220px; position:relative; }
  .equipos { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; }
  .eq { background:var(--s2); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .eq .nom { display:flex; align-items:center; gap:8px; font-weight:700; }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  .eq .linea { display:flex; justify-content:space-between; color:var(--mut); font-size:13px; margin-top:7px; }
  .eq .linea b { color:var(--txt); font-weight:600; }
  .alerta { display:flex; gap:10px; align-items:flex-start; background:#1f1213; border:1px solid #4a2326;
            border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:13px; }
  .todo-ok { color:var(--ok); font-weight:600; font-size:14px; }
  .top { display:flex; flex-direction:column; gap:8px; }
  #alertas { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr)); gap:8px; margin-bottom:12px; }
  .equipos { grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr)) !important; }
  body { overflow-x:hidden; }
  @media (max-width:600px) { .wrap { padding:20px 16px 48px; } .tabs { width:100%; } .tabs button { flex:1; padding:8px 4px; }
    .kpi .val { font-size:34px; } .top .fila { grid-template-columns:90px 1fr 34px; } }
  #alertas .alerta { margin:0; }
  .top .fila { display:grid; grid-template-columns:110px 1fr 40px; gap:10px; align-items:center; font-size:13px; }
  .top .barra { height:12px; border-radius:6px; background:linear-gradient(90deg,var(--coral),var(--coral2)); }
  .top .fila span:last-child { text-align:right; color:var(--mut); font-variant-numeric:tabular-nums; }
  footer { color:var(--mut); font-size:12px; margin-top:28px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>SISTEMAS <span>DAKOTA</span> · PANEL</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="periodos">
      <div class="tabs" id="tabs">
        <button data-p="hoy" class="on">Hoy</button><button data-p="ayer">Ayer</button>
        <button data-p="anteayer">Anteayer</button><button data-p="d7">7 días</button><button data-p="d30">30 días</button>
      </div>
      <div class="mas">
        <select id="selPeriodo" aria-label="Otros periodos"></select>
        <span id="rangoLibre" hidden>
          <input type="date" id="fDesde" aria-label="Desde"> <span class="a">a</span> <input type="date" id="fHasta" aria-label="Hasta">
          <button id="bRango" class="boton">Ver</button>
        </span>
        <button id="bExcel" class="boton excel">Descargar Excel</button>
      </div>
    </div>
  </header>

  <div id="kpis"></div>

  <div id="equipos"></div>

  <div class="grid">
    <div class="card c8"><h3 id="tDias"></h3><div class="alto"><canvas id="gDias"></canvas></div></div>
    <div class="card c4"><h3>Jugadores más elegidos</h3><div class="top" id="top"></div></div>
    <div class="card c12"><h3>Flujo de usuarios <small>usuarios por hora</small></h3><div class="medio"><canvas id="gHoras"></canvas></div></div>
  </div>
  <footer>Datos de cada sistema, enviados cada 10 minutos y al cerrar.</footer>
</div>

<script>
// Pagina suelta (Pau, 2026-11-01): fuera de Google no sale el aviso de «aplicacion creada por un
// usuario». Los datos los da la hoja. Direccion y clave van tras la # del enlace, no en este
// fichero: panel.html#u=<direccion /exec>&k=<CLAVE_PANEL>
const PARAM = new URLSearchParams(location.hash.slice(1));
const MADRE = "DK-RM-FJ1";            // la madre no opera: no cuenta
const COLORES = ["#ff6b5b", "#5bc0ff", "#3ecf8e", "#f5b041", "#b48cff", "#ff8fd1", "#7de0d6"];
Chart.defaults.color = "#8c8c98"; Chart.defaults.borderColor = "#24242e";
Chart.defaults.font.family = "Inter, Segoe UI, sans-serif";
const PERIODOS = { hoy: [0, 1], ayer: [1, 1], anteayer: [2, 1], d7: [0, 7], d30: [0, 30] };

let FILAS = [], AHORA = new Date(), hoy = "", periodo = "hoy";
const dos = n => String(n).padStart(2, "0");
const fmt = d => `${d.getFullYear()}-${dos(d.getMonth() + 1)}-${dos(d.getDate())}`;   // dia de aqui, no UTC
const atras = n => { const d = new Date(AHORA); d.setDate(d.getDate() - n); return fmt(d); };
const nombre = r => r.equipo.replace("DK-RM-", "") + " · " + (r.app || "FotoJugador");
const suma = (f, k) => f.reduce((a, r) => a + (r[k] || 0), 0);
const media = v => v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
const graficas = {};
const MIL = new Intl.NumberFormat("es-ES", { useGrouping: "always" });   // 2.962, no 2962

// lo acumulado en las horas ya terminadas: `hora` = la hora en curso
const hastaHora = (f, k, hora) => f.reduce((a, r) => a + Object.entries(r[k] || {})
  .reduce((s, [h, n]) => s + (+h < hora ? n : 0), 0), 0);

function comparar(a, b, texto, aprox) {
  if (!b) return '<span class="flat">—</span>';
  const p = Math.round(100 * (a - b) / b);
  return `<span class="${p > 0 ? "up" : p < 0 ? "down" : "flat"}">${p > 0 ? "▲" : p < 0 ? "▼" : "="} ${aprox ? "≈ " : ""}${Math.abs(p)} % ${texto}</span>`;
}

// PERIODO (09-11): los botones de dias, un mes (mes:AAAA-MM) o de tal dia a tal dia (rango).
// Devuelve los dias del periodo (sin pasar de hoy) y como se llama.
let RANGO_LIBRE = null;
const diaMas = (d, n) => { const x = new Date(d + "T12:00"); x.setDate(x.getDate() + n); return fmt(x); };
const diasEntre = (a, b) => { const out = []; for (let d = a; d <= b; d = diaMas(d, 1)) out.push(d); return out; };
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const nombreMes = m => `${MESES[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}`;
const fechaCorta = d => new Date(d + "T12:00").toLocaleDateString("es-ES", {day: "numeric", month: "short", year: "numeric"});
function periodoActual() {
  if (PERIODOS[periodo]) {
    const [desde0, n] = PERIODOS[periodo];
    const rango = [...Array(n)].map((_, i) => atras(desde0 + n - 1 - i));
    const etq = {hoy: "Hoy", ayer: "Ayer", anteayer: "Anteayer", d7: "Últimos 7 días", d30: "Últimos 30 días"}[periodo];
    return { rango, etiqueta: n === 1 ? `${etq} (${fechaCorta(rango[0])})` : `${etq} (${fechaCorta(rango[0])} a ${fechaCorta(rango[n - 1])})` };
  }
  if (periodo.startsWith("mes:")) {
    const m = periodo.slice(4), fin = diaMas(diaMas(m + "-01", 31).slice(0, 7) + "-01", -1);
    return { rango: diasEntre(m + "-01", fin < hoy ? fin : hoy), etiqueta: nombreMes(m).replace(/^./, c => c.toUpperCase()) };
  }
  const [a, b] = RANGO_LIBRE;
  return { rango: diasEntre(a, b), etiqueta: a === b ? fechaCorta(a) : `Del ${fechaCorta(a)} al ${fechaCorta(b)}` };
}
let ULTIMO = null;                          // lo que se ve: lo que se descarga en Excel

function pintar() {
  const { rango, etiqueta } = periodoActual();
  const n = rango.length;
  const f = FILAS.filter(r => r.fecha >= rango[0] && r.fecha <= rango[n - 1]);
  const prev = FILAS.filter(r => r.fecha >= diaMas(rango[0], -n) && r.fecha < rango[0]);
  const equipos = [...new Set(FILAS.map(nombre))].sort();
  document.getElementById("sub").textContent =
    `${equipos.length} sistemas · actualizado ${AHORA.toLocaleString("es-ES", {dateStyle: "long", timeStyle: "short"})}`;

  // CUADRO DE YURI (04-11): PHOTOPLAYER (= FotoJugador), COPA y TOTAL
  const esCopa = r => r.app === "FotoCopa";
  const fj = f.filter(r => !esCopa(r)), fc = f.filter(esCopa);
  const pj = prev.filter(r => !esCopa(r)), pc = prev.filter(esCopa);
  const es = x => x == null ? "–" : MIL.format(x);
  const coma = x => x == null ? "–" : x.toFixed(1).replace(".", ",");
  // comparacion: HOY contra AYER hasta la misma hora (solo horas terminadas); si no, el periodo anterior
  function delta(g, gp, k, kHora) {
    if (periodo !== "hoy") return comparar(suma(g, k), suma(gp, k), n === 1 ? "vs día anterior" : "vs periodo anterior");
    const h = AHORA.getHours(), texto = `vs ayer hasta las ${h}:00`;
    if (kHora === "por_hora" || kHora === "_qrh") return comparar(hastaHora(g, "por_hora", h), hastaHora(gp, "por_hora", h), texto);
    if (kHora && gp.length && gp.every(r => r[kHora])) return comparar(hastaHora(g, kHora, h), hastaHora(gp, kHora, h), texto);
    return "";
  }
  // los dias anteriores al 01-11 no traen shots; los anteriores al 05-11, el reparto de composiciones
  const sumaSi = (g, k) => { const c = g.filter(r => r[k] != null); return c.length ? suma(c, k) : null; };
  const kpi = (lab, val, del, nota) => `<div class="kpi"><div class="lab">${lab}</div><div class="val">${val}</div><div class="del">${del || "&nbsp;"}</div>${nota ? `<div class="nota">${nota}</div>` : ""}</div>`;
  const seccion = (titulo, extra, cls, html) => `<div class="seccion ${cls}"><h2>${titulo}<span>${extra}</span></h2><div class="kpis">${html}</div></div>`;

  // QR (tarjetas) y USUARIOS FINALES (QR + usuarios añadidos con el mismo QR): los informes de antes
  // de la 0.2.19 solo traen "visitantes", que eran usuarios; ahi QR = usuarios (Pau, 04-11)
  f.concat(prev).forEach(r => {
    r._qr = r.qr_escaneados ?? r.visitantes ?? 0; r._usu = r.usuarios_finales ?? r.visitantes ?? 0;
    r._qrh = r.qr_por_hora || r.por_hora;
    r._usuAle = r.usuarios_alegrias ?? Math.round((r.celebracion_pct || 0) * (r.visitantes || 0) / 100);
  });
  const porUsu = (g, k) => { const c = g.filter(r => r[k] != null && r._usu); return c.length && suma(c, "_usu") ? suma(c, k) / suma(c, "_usu") : null; };
  const qrJ = suma(fj, "_qr"), usuJ = suma(fj, "_usu"), cJ = suma(fj, "fotos_finales");
  const cJug = sumaSi(fj, "composiciones_jugadores"), cAle = sumaSi(fj, "composiciones_alegrias");
  const jpu = porUsu(fj, "composiciones_jugadores") ?? media(fj.filter(r => r.jugadores_por_visitante).map(r => r.jugadores_por_visitante));
  const usuAle = suma(fj, "_usuAle"), aprox = fj.some(r => r.usuarios_alegrias == null) ? "≈ " : "";
  const reparto = cJug == null ? "" : `Jugadores ${es(cJug)} · Alegrías ${es(cAle)} · Escenarios –`;
  const qrC = suma(fc, "_qr"), cC = suma(fc, "fotos_finales");
  const sJ = sumaSi(fj, "disparos"), sC = sumaSi(fc, "disparos");
  const sT = sJ == null && sC == null ? null : (sJ || 0) + (sC || 0);

  ULTIMO = { etiqueta, desde: rango[0], hasta: rango[n - 1], filas: f, resumen: [
    ["PHOTOPLAYER", "QR escaneados", qrJ], ["PHOTOPLAYER", "Usuarios finales", usuJ], ["PHOTOPLAYER", "Fotos finales", cJ],
    ["PHOTOPLAYER", "Fotos finales de jugadores", cJug], ["PHOTOPLAYER", "Fotos finales de alegrías", cAle],
    ["PHOTOPLAYER", "Shots", sJ], ["PHOTOPLAYER", "Jugadores por usuario", jpu && +jpu.toFixed(2)],
    ["PHOTOPLAYER", "Alegrías por usuario", porUsu(fj, "composiciones_alegrias") && +porUsu(fj, "composiciones_alegrias").toFixed(2)],
    ["PHOTOPLAYER", "Usuarios que hacen alegrías", usuAle],
    ["PHOTOCOPA", "QR escaneados", qrC], ["PHOTOCOPA", "Fotos finales", cC], ["PHOTOCOPA", "Shots", sC],
    ["TOTAL", "QR escaneados", qrJ + qrC], ["TOTAL", "Usuarios finales", usuJ + qrC], ["TOTAL", "Fotos finales", cJ + cC], ["TOTAL", "Shots", sT]] };
  document.getElementById("bExcel").textContent = `Descargar Excel · ${etiqueta}`;
  document.getElementById("kpis").innerHTML =
    seccion("PHOTO<em>PLAYER</em>", "", "",
      kpi("QR escaneados", es(qrJ), delta(fj, pj, "_qr", "_qrh")) +
      kpi("Usuarios finales", es(usuJ), delta(fj, pj, "_usu", "por_hora"), "QR + usuarios añadidos") +
      kpi("Fotos finales", es(cJ), delta(fj, pj, "fotos_finales", "fotos_por_hora"), reparto) +
      kpi("Shots", es(sJ), periodo === "hoy" ? "" : delta(fj, pj, "disparos")) +
      kpi("Jugadores por usuario", coma(jpu), "") +
      kpi("Alegrías por usuario", coma(porUsu(fj, "composiciones_alegrias")), "") +
      kpi("Escenarios por usuario", "–", "", "Aún no hay escenarios en la app") +
      kpi("Usuarios que hacen alegrías", aprox + es(usuAle), usuJ ? `<span class="flat">${aprox}${Math.round(100 * usuAle / usuJ)} % de los usuarios</span>` : "")) +
    seccion("PHOTO<em>COPA</em>", "", "",
      kpi("QR escaneados", es(qrC), delta(fc, pc, "_qr", "_qrh")) +
      kpi("Fotos finales", es(cC), delta(fc, pc, "fotos_finales", "fotos_por_hora")) +
      kpi("Shots", es(sC), periodo === "hoy" ? "" : delta(fc, pc, "disparos"))) +
    seccion("TOTAL", "PhotoPlayer + PhotoCopa", "total",
      kpi("QR escaneados", es(qrJ + qrC), delta(f, prev, "_qr", "_qrh")) +
      kpi("Usuarios finales", es(usuJ + qrC), delta(f, prev, "_usu", "por_hora")) +
      kpi("Fotos finales", es(cJ + cC), delta(f, prev, "fotos_finales", "fotos_por_hora"), "Jugadores + alegrías + escenarios + Copa") +
      kpi("Shots", es(sT), periodo === "hoy" ? "" : delta(f, prev, "disparos")));

  // QR por dia, apilado por sistema; en un dia suelto, por sistema
  document.getElementById("tDias").innerHTML = n === 1 ? "QR escaneados <small>por sistema</small>" : "QR escaneados por día <small>por sistema</small>";
  hacer("gDias", "bar", {
    labels: n === 1 ? ["Total"] : rango.map(d => new Date(d + "T12:00").toLocaleDateString("es-ES", {day: "numeric", month: "short"})),
    datasets: equipos.map((e, i) => ({ label: e, backgroundColor: COLORES[i % COLORES.length], borderRadius: 4,
      data: rango.map(x => suma(f.filter(r => nombre(r) === e && r.fecha === x), "_qr")) })).filter(d => d.data.some(x => x))
  }, { scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true } } });

  // por hora
  const horas = [...Array(14)].map((_, i) => dos(i + 8));
  const ph = horas.map(h => f.reduce((a, r) => a + ((r.por_hora || {})[h] || 0), 0) / (n === 1 ? 1 : Math.max(1, new Set(f.filter(r => r.visitantes).map(r => r.fecha)).size)));
  const max = Math.max(...ph);
  hacer("gHoras", "bar", { labels: horas.map(h => h + "h"),
    datasets: [{ label: n === 1 ? "Usuarios" : "Media por día", data: ph.map(x => Math.round(x * 10) / 10), borderRadius: 5,
                 backgroundColor: ph.map(x => x === max && x > 0 ? "#ff6b5b" : "#3a3a48") }] },
    { plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true } } });

  // top jugadores
  const top = {};
  f.forEach(r => (r.top_jugadores || []).forEach(([nom, c]) => top[nom] = (top[nom] || 0) + c));
  const lista = Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 10), mx = lista.length ? lista[0][1] : 1;
  document.getElementById("top").innerHTML = lista.length ? lista.map(([nom, c]) =>
    `<div class="fila"><span>${nom}</span><div class="barra" style="width:${Math.max(4, 100 * c / mx)}%"></div><span>${c}</span></div>`).join("")
    : '<span style="color:var(--mut)">Sin datos todavía</span>';
}

// EQUIPOS (Pau, 2026-11-01): en verde los que estan trabajando, cada uno bajo su app, y en rojo
// los demas. Trabajando = ha mandado datos hace menos de ACTIVO_MIN minutos y no ha cerrado.
const ACTIVO_MIN = 25;
function pintarEquipos() {
  const ultimo = {};
  FILAS.forEach(r => { const u = ultimo[r.equipo];
    if (!u || (r.recibido || "") > (u.recibido || "")) ultimo[r.equipo] = r; });
  const activo = r => !r.cerrada && (AHORA - new Date(r.recibido)) / 60000 < ACTIVO_MIN;
  const lista = Object.values(ultimo).sort((a, b) => a.equipo < b.equipo ? -1 : 1);
  const num = (r, k) => r.fecha === hoy && r[k] != null ? r[k].toLocaleString("es-ES") : "–";
  // TIEMPOS DE AHORA (05-11): en rojo si pasan de 2 min (la foto final o PhotoServer van tarde)
  const ahora = (r, k, lab) => r.fecha === hoy && r[k] != null && activo(r)
    ? `<div class="linea">${lab}<b style="color:var(--${r[k] > 120 ? "err" : "txt"})">${r[k] < 120 ? r[k] + " s" : (r[k] / 60).toFixed(1).replace(".", ",") + " min"}</b></div>` : "";
  const ficha = (r, color) => `<div class="eq"><div class="nom"><span class="dot" style="background:var(--${color})"></span>${r.equipo.replace("DK-RM-", "")}</div>
    <div class="linea">QR<b>${num(r, "visitantes")}</b></div><div class="linea">Shots<b>${num(r, "disparos")}</b></div>
    <div class="linea">Fotos finales<b>${num(r, "fotos_finales")}</b></div>
    ${ahora(r, "foto_final_ahora_s", "Foto final ahora")}${ahora(r, "photoserver_retraso_s", "Retraso PhotoServer")}
    <div class="linea">Disco<b>${r.disco_libre_gb} GB</b></div><div class="linea">Versión<b>${r.version}</b></div></div>`;
  const bloque = (titulo, f, color) => f.length
    ? `<div class="bloque"><h3>${titulo}</h3><div class="equipos">${f.map(r => ficha(r, color)).join("")}</div></div>` : "";
  const app = n => lista.filter(r => activo(r) && (r.app || "FotoJugador") === n);
  document.getElementById("equipos").innerHTML = bloque("EQUIPOS PHOTOPLAYER", app("FotoJugador"), "ok") +
    bloque("EQUIPOS COPA", app("FotoCopa"), "ok") + bloque("SIN TRABAJAR", lista.filter(r => !activo(r)), "err");
}

function hacer(id, tipo, data, opciones) {
  if (graficas[id]) graficas[id].destroy();
  graficas[id] = new Chart(document.getElementById(id), { type: tipo, data,
    options: Object.assign({ responsive: true, maintainAspectRatio: false, animation: { duration: 500 },
      plugins: { legend: { position: "bottom", labels: { boxWidth: 10, boxHeight: 10 } } } }, opciones) });
}

document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  elegir(b.dataset.p);
});

function llenarMeses() {
  const sel = document.getElementById("selPeriodo"), actual = sel.value;
  const mesHoy = hoy.slice(0, 7), mesAnt = diaMas(mesHoy + "-01", -1).slice(0, 7);
  const meses = [...new Set(FILAS.map(r => r.fecha.slice(0, 7)))].filter(m => m !== mesHoy && m !== mesAnt).sort().reverse();
  sel.innerHTML = `<option value="">Más periodos…</option><option value="mes:${mesHoy}">Este mes (${nombreMes(mesHoy)})</option>` +
    `<option value="mes:${mesAnt}">Mes anterior (${nombreMes(mesAnt)})</option>` +
    meses.map(m => `<option value="mes:${m}">${nombreMes(m).replace(/^./, c => c.toUpperCase())}</option>`).join("") +
    `<option value="rango">Elegir fechas…</option>`;
  if ([...sel.options].some(o => o.value === actual)) sel.value = actual;
  const primera = FILAS.reduce((a, r) => r.fecha < a ? r.fecha : a, hoy);
  for (const id of ["fDesde", "fHasta"]) { const i = document.getElementById(id); i.min = primera; i.max = hoy; }
}

function elegir(p) {                          // marca el boton o el desplegable que toca
  periodo = p;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x.dataset.p === p));
  const sel = document.getElementById("selPeriodo");
  if (PERIODOS[p]) { sel.value = ""; document.getElementById("rangoLibre").hidden = true; }
  pintar();
}

document.getElementById("selPeriodo").addEventListener("change", e => {
  const v = e.target.value;
  if (!v) return elegir("hoy");
  if (v === "rango") {
    document.getElementById("rangoLibre").hidden = false;
    const d = document.getElementById("fDesde"), h = document.getElementById("fHasta");
    if (!d.value) d.value = atras(6);
    if (!h.value) h.value = hoy;
    return;
  }
  document.getElementById("rangoLibre").hidden = true;
  elegir(v);
});
document.getElementById("bRango").addEventListener("click", () => {
  let a = document.getElementById("fDesde").value, b = document.getElementById("fHasta").value;
  if (!a || !b) return;
  if (a > b) [a, b] = [b, a];
  RANGO_LIBRE = [a, b > hoy ? hoy : b];
  document.getElementById("selPeriodo").value = "rango";
  elegir("rango");
});

// DESCARGAR EXCEL (09-11): lo que se esta viendo, con la franja en el nombre y en la primera linea
document.getElementById("bExcel").addEventListener("click", () => {
  if (!ULTIMO || typeof XLSX === "undefined") return;
  const { etiqueta, desde, hasta, filas, resumen } = ULTIMO;
  const cab = [[`Sistemas Dakota · Panel — ${etiqueta}`], [`Datos del ${desde} al ${hasta}. Descargado el ${new Date().toLocaleString("es-ES")}`], []];
  const libro = XLSX.utils.book_new();
  const res = XLSX.utils.aoa_to_sheet([...cab, ["Sección", "Dato", "Valor"], ...resumen.map(([s, d, v]) => [s, d, v ?? ""])]);
  res["!cols"] = [{ wch: 14 }, { wch: 32 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(libro, res, "Resumen");
  const cols = [["Fecha", "fecha"], ["Equipo", "equipo"], ["App", "app"], ["QR escaneados", "_qr"], ["Usuarios finales", "_usu"],
    ["Fotos finales", "fotos_finales"], ["Fotos de jugadores", "composiciones_jugadores"], ["Fotos de alegrías", "composiciones_alegrias"],
    ["Shots", "disparos"], ["Usuarios con alegría", "usuarios_alegrias"], ["Hora punta", "hora_punta"], ["Primera foto", "primera"],
    ["Última foto", "ultima"], ["Foto final media (s)", "foto_final_s"], ["Versión", "version"]];
  const orden = [...filas].sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : a.equipo < b.equipo ? -1 : 1);
  const dia = XLSX.utils.aoa_to_sheet([...cab, cols.map(c => c[0]),
    ...orden.map(r => cols.map(([, k]) => k === "app" ? (r.app || "FotoJugador") : (r[k] ?? "")))]);
  dia["!cols"] = cols.map(([t]) => ({ wch: Math.max(10, t.length + 2) }));
  XLSX.utils.book_append_sheet(libro, dia, "Por día y equipo");
  const horas = [...Array(16)].map((_, i) => dos(i + 7));
  const eqs = [...new Set(orden.map(nombre))];
  const hor = XLSX.utils.aoa_to_sheet([...cab, ["Hora", ...eqs, "Total"], ...horas.map(h => {
    const v = eqs.map(e => orden.filter(r => nombre(r) === e).reduce((a, r) => a + ((r.por_hora || {})[h] || 0), 0));
    return [`${h}:00`, ...v, v.reduce((a, b) => a + b, 0)];
  })]);
  XLSX.utils.book_append_sheet(libro, hor, "Usuarios por hora");
  XLSX.writeFile(libro, desde === hasta ? `Panel Dakota ${desde}.xlsx` : `Panel Dakota ${desde} a ${hasta}.xlsx`);
});

async function cargar() {
  try {
    const r = await fetch(`${PARAM.get("u")}?k=${encodeURIComponent(PARAM.get("k") || "")}&formato=json`);
    const d = await r.json();
    FILAS = d.filas.filter(x => x.equipo !== MADRE);
    AHORA = new Date(d.ahora); hoy = fmt(AHORA);
    llenarMeses();
    pintar();
    pintarEquipos();
  } catch (e) {
    if (!FILAS.length) document.getElementById("sub").textContent = "No se han podido leer los datos: revisa el enlace";
  }
}
cargar();
setInterval(cargar, 5 * 60 * 1000);       // los equipos mandan cada 10 minutos
</script>
